<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 jailbreak</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700&display=swap');
  
  * { margin:0; padding:0; box-sizing:border-box; }
  
  html {
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1326 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: white;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 40px 50px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 100, 255, 0.05);
    transition: all 0.3s ease;
  }
  
  .container:hover {
    border-color: rgba(100, 150, 255, 0.3);
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 100, 255, 0.1);
  }
  
  .brand {
    text-align: center;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  
  .brand img {
    width: 28px;
    height: 28px;
    margin-right: 8px;
    border-radius: 50%;
    vertical-align: middle;
  }
  
  .brand b {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .14em;
    color: #e6ebf2;
    vertical-align: middle;
  }
  
  .brand .highlight {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(255, 46, 99, 0.3);
  }
  
  .brand .ps4-text {
    background: linear-gradient(135deg, #0066ff, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .brand .ps5-text {
    background: linear-gradient(135deg, #ff0066, #ff33cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .separator {
    border: none;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    margin: 20px 0;
  }
  
  #wrap {
    padding: 16px 0;
  }
  
  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
    color: #c8ced8;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  
  #state.warn { color: #d8c07f; animation: pulse 1.5s ease-in-out infinite; }
  #state.bad { color: #d08a7f; }
  #state.ok { color: #7fd0a0; }
  
  #det {
    font-size: 13px;
    color: #8b95a3;
    margin: 0 0 4px;
    font-family: 'Tajawal', sans-serif;
  }
  
  #det b {
    color: #c8ced8;
    font-weight: 600;
  }
  
  #cache {
    font-size: 12px;
    color: #5c6672;
    margin: 10px 0 0;
    min-height: 14px;
    font-family: 'Orbitron', monospace;
    letter-spacing: 0.5px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.03);
    transition: all 0.3s ease;
  }
  
  #cache.cacheok {
    color: #7fd0a0;
    border-color: rgba(127,208,160,0.15);
    background: rgba(127,208,160,0.05);
  }
  
  .ok { color:#7fd0a0; }
  .bad { color:#d08a7f; }
  .warn { color:#d8c07f; }
  
  .credit {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: #556688;
    letter-spacing: 2px;
    margin-top: 20px;
  }
  
  .credit-link {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  
  .credit-link:hover {
    text-shadow: 0 0 30px rgba(255, 46, 99, 0.4);
  }
  
  .thanks {
    font-size: 12px;
    color: #445566;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  
  @media (max-width: 600px) {
    .container { padding: 25px 20px; border-radius: 20px; }
    #state { font-size: 18px; }
  }
  
  @media (max-width: 400px) {
    .container { padding: 20px 15px; }
    #state { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <img src="logo_raw.png" alt="" width="28" height="28">
    <b>
      <span class="highlight">Mustafa</span>
      <span class="ps4-text">PS4</span>
      <span class="ps5-text">PS5</span>
    </b>
  </div>
  
  <hr class="separator">
  
  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
  
  <hr class="separator">
  
  <div class="credit">
    Designed by <a href="#" class="credit-link">Mustafa</a>
    <div class="thanks">❤️ Special thanks to all scene developers</div>
  </div>
</div>

<!-- نفس السكربت الأصلي بالضبط بدون تغيير -->
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
