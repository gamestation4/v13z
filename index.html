<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustafa PS4 PS5 - Exploit Host</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1 class="main-title">
            <span class="highlight">Mustafa</span>
            <span class="ps4-text">PS4</span>
            <span class="ps5-text">PS5</span>
        </h1>
        <div class="subtitle">Exploit Host</div>
        <div class="version-badge">JB v3.0</div>
    </header>
    
    <hr class="separator">

    <div id="menu">
        <h2 class="fw-title">Firmware Detection</h2>
        <p class="fw-range">Detecting <span class="range-highlight">PlayStation 4</span></p>
        
        <div class="status-bar">
            <span id="state" class="status-text loading">⏳ Starting...</span>
        </div>

        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Mustafa</a></p>
            <p class="thanks">❤️ Special thanks to all scene developers</p>
        </footer>
    </div>
</div>

<script>
    var stateEl = document.getElementById('state');

    function updateStatus(msg) {
        stateEl.innerHTML = msg;
    }

    // التحقق من الجهاز والإصدار
    var uaFull = navigator.userAgent;
    var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
    var isPS4 = match !== null;
    var fwVersion = isPS4 ? match[1] : "Unknown";
    var fwNum = parseFloat(fwVersion);
    var key = null;
    var bug = null;

    if (match) {
        var minor = parseInt(match[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = match[1] + "." + ms;
        fwNum = parseInt(match[1], 10) * 100 + parseInt(ms, 10);
    }

    if (isPS4) {
        if (fwNum <= 1202) {
            bug = "lapse";
        } else if (fwNum >= 1250) {
            bug = "poops";
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        if (!isPS4) {
            updateStatus('⚠️ This page is for PS4 only!');
            stateEl.className = 'status-text error';
            return;
        }

        if (bug === "lapse") {
            updateStatus('✅ Detected PS4 Firmware: ' + fwVersion);
            setTimeout(function() {
                updateStatus('🚀 Loading Lapse exploit...');
                window.location.replace('run_lapse.html?bug=lapse');
            }, 1500);
        } else if (bug === "poops") {
            updateStatus('✅ Detected PS4 Firmware: ' + fwVersion);
            setTimeout(function() {
                updateStatus('🚀 Loading Poops exploit...');
                window.location.replace('run_poops.html?bug=poops');
            }, 1500);
        } else {
            updateStatus('❌ Unsupported Firmware: ' + fwVersion);
            stateEl.className = 'status-text error';
        }
    });
</script>
</body>
</html>
