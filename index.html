<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustafa PS4 PS5 - Jailbreak</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700&display=swap');
  
  * { margin:0; padding:0; box-sizing:border-box; }
  
  html {
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1326 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: white;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 40px 50px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 100, 255, 0.05);
    transition: all 0.3s ease;
  }
  
  .container:hover {
    border-color: rgba(100, 150, 255, 0.3);
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 100, 255, 0.1);
  }
  
  header { margin-bottom: 20px; }
  
  .main-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    text-shadow: 0 0 30px rgba(0, 100, 255, 0.2);
    letter-spacing: 2px;
    margin-bottom: 5px;
  }
  
  .highlight {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(255, 46, 99, 0.3);
  }
  
  .ps4-text {
    background: linear-gradient(135deg, #0066ff, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .ps5-text {
    background: linear-gradient(135deg, #ff0066, #ff33cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle {
    font-size: 14px;
    font-weight: 700;
    color: #8899bb;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-top: -5px;
  }
  
  .version-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 15px;
    border-radius: 20px;
    margin-top: 10px;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(255, 46, 99, 0.3);
  }
  
  .separator {
    border: none;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    margin: 20px 0;
  }
  
  #wrap { padding: 0; }
  
  #state {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 10px;
    color: #8899bb;
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  
  #state.warn { color: #d8c07f; animation: pulse 1.5s ease-in-out infinite; }
  #state.bad { color: #d08a7f; }
  #state.ok { color: #7fd0a0; }
  
  #det {
    font-size: 14px;
    color: #7788aa;
    margin: 0 0 4px;
  }
  #det b { color: #c8ced8; font-weight:600; }
  
  #cache {
    font-size: 13px;
    color: #5c6672;
    margin: 10px 0;
    min-height: 20px;
    transition: all 0.3s ease;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
  }
  
  #cache.cacheok { 
    color: #7fd0a0; 
    border: 1px solid rgba(127,208,160,0.2);
    background: rgba(127,208,160,0.05);
  }
  
  #cache.cacheloading { 
    color: #d8c07f; 
    border: 1px solid rgba(216,192,127,0.2);
    background: rgba(216,192,127,0.05);
    animation: pulse 1.5s ease-in-out infinite;
  }
  
  #cache.cacheerror { 
    color: #d08a7f; 
    border: 1px solid rgba(208,138,127,0.2);
    background: rgba(208,138,127,0.05);
  }
  
  .cache-number {
    display: inline-block;
    background: rgba(255,255,255,0.05);
    padding: 2px 12px;
    border-radius: 12px;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: #8899bb;
    margin: 5px 3px;
  }
  
  .cache-hash {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    color: #445566;
    margin: 3px;
    word-break: break-all;
  }
  
  .ok { color:#7fd0a0; }
  .bad { color:#d08a7f; }
  .warn { color:#d8c07f; }
  
  footer {
    margin-top: 20px;
  }
  
  .credit {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: #556688;
    letter-spacing: 2px;
  }
  
  .credit-link {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  
  .credit-link:hover {
    text-shadow: 0 0 30px rgba(255, 46, 99, 0.4);
  }
  
  .thanks {
    font-size: 12px;
    color: #445566;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  
  @media (max-width: 600px) {
    .container { padding: 25px 20px; border-radius: 20px; }
    .main-title { font-size: 28px; }
    .subtitle { font-size: 11px; letter-spacing: 5px; }
    #state { font-size: 15px; }
    .cache-hash { font-size: 8px; }
  }
  
  @media (max-width: 400px) {
    .main-title { font-size: 22px; }
    .version-badge { font-size: 10px; padding: 2px 12px; }
    #state { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 class="main-title">
      <span class="highlight">Mustafa</span>
      <span class="ps4-text">PS4</span>
      <span class="ps5-text">PS5</span>
    </h1>
    <div class="subtitle">Jailbreak Host</div>
    <div class="version-badge">⚡ v5.0</div>
  </header>
  
  <hr class="separator">
  
  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache">
      <div id="cache-status">⏳ checking cache...</div>
      <div style="margin-top:5px;">
        <span class="cache-number" id="cache-version">📦 v1.0.0</span>
        <span class="cache-hash" id="cache-hash">🔑 0aca91b3</span>
      </div>
    </div>
  </div>
  
  <hr class="separator">
  
  <footer>
    <p class="credit">Designed by <a href="#" class="credit-link">Mustafa</a></p>
    <p class="thanks">❤️ Special thanks to all scene developers</p>
  </footer>
</div>

<script>
// ===== السكربت الأصلي مع إضافة رقم الكاش =====
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var cacheStatus = document.getElementById("cache-status");
    var cacheVersion = document.getElementById("cache-version");
    var cacheHash = document.getElementById("cache-hash");
    
    // معلومات الكاش من ملف cache.appcache
    var CACHE_VERSION = "1.0.0";
    var CACHE_BUILD = "0aca91b343b8b942";
    var CACHE_HASH = "0aca91b3";
    
    function setState(t, c) { 
        stateEl.textContent = t; 
        stateEl.className = c || ""; 
    }
    
    function setCache(t, ok, extra) {
        cacheStatus.textContent = t;
        cacheEl.className = ok ? "cacheok" : (extra === "loading" ? "cacheloading" : "cacheerror");
        cacheVersion.textContent = "📦 v" + CACHE_VERSION;
        cacheHash.textContent = "🔑 " + CACHE_HASH;
    }
    
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { 
        setState("UNSUPPORTED FIRMWARE", "bad");
        setCache("❌ Unsupported", false);
        return; 
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
        
    function go() { 
        setState("loading " + bug + " chain...", "warn");
        setCache("🚀 Loading exploit...", true);
        setTimeout(function() {
            location.replace(target);
        }, 500);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        setCache("👆 " + msg, true);
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // ===== نظام الكاش مع عرض الحالة =====
    var ac = window.applicationCache;
    
    if (!ac || location.protocol === 'file:') {
        setCache("⚠️ Cache not available (local file)", false);
        go();
        return;
    }

    if (!document.documentElement.hasAttribute("manifest")) {
        setCache("⚠️ No manifest found", false);
        go();
        return;
    }

    var statusTexts = ['UNCACHED', 'IDLE', 'CHECKING', 'DOWNLOADING', 'UPDATEREADY', 'OBSOLETE'];
    
    function updateCacheStatus() {
        var status = ac.status;
        var statusText = statusTexts[status] || 'UNKNOWN';
        var isOk = (status === ac.IDLE || status === ac.UPDATEREADY);
        var icon = isOk ? '✅' : (status === ac.DOWNLOADING || status === ac.CHECKING ? '⏳' : '⚠️');
        setCache(icon + ' ' + statusText + ' | build ' + CACHE_BUILD, isOk, status === ac.DOWNLOADING || status === ac.CHECKING ? 'loading' : '');
    }

    if (!navigator.onLine) {
        setCache("📦 Offline -- from cache v" + CACHE_VERSION, true);
        go();
    } else if (ac.status === ac.IDLE) {
        updateCacheStatus();
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        updateCacheStatus();
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("⏳ Checking cache... build " + CACHE_BUILD, false, "loading");
        
        ac.addEventListener("checking", function () {
            setCache("🔍 Checking for updates... build " + CACHE_BUILD, false, "loading");
        }, false);
        
        ac.addEventListener("downloading", function () {
            setCache("📥 Caching for offline use... build " + CACHE_BUILD, false, "loading");
        }, false);
        
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setCache("📥 Caching " + pct + "% build " + CACHE_BUILD, false, "loading");
            }
        }, false);

        ac.addEventListener("cached", function () {
            setCache("✅ Cached for offline use | build " + CACHE_BUILD, true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("🔄 Update downloaded | build " + CACHE_BUILD, true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("✅ Cached -- offline ready | build " + CACHE_BUILD, true);
            go();
        }, false);
        
        ac.addEventListener("error", function () {
            setCache("❌ Cache error | build " + CACHE_BUILD, false);
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        
        ac.addEventListener("obsolete", function () {
            setCache("⚠️ Cache obsolete | build " + CACHE_BUILD, false);
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
