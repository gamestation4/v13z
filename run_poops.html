<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustafa PS4 PS5 - Poops Chain</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  html, body {
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1326 100%);
    min-height:100vh;
    color:#fff;
    font:15px/1.45 "Segoe UI", system-ui, sans-serif;
    text-align:center;
  }
  
  body {
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  
  #brand {
    background:rgba(10,14,26,0.95);
    border-bottom:1px solid rgba(255,255,255,0.1);
    padding:12px 24px;
    text-align:left;
    backdrop-filter:blur(10px);
  }
  
  #brand img {
    width:32px;
    height:32px;
    margin-right:10px;
    border-radius:50%;
    vertical-align:middle;
  }
  
  #brand b {
    font-size:16px;
    font-weight:700;
    letter-spacing:.14em;
    color:#e6ebf2;
    vertical-align:middle;
  }
  
  #wrap {
    flex:1;
    max-width:1200px;
    width:100%;
    margin:0 auto;
    padding:20px 24px;
  }
  
  #state {
    font-size:22px;
    font-weight:700;
    margin:0 0 10px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    padding:16px 24px;
    backdrop-filter:blur(10px);
  }
  
  #out {
    white-space:pre-wrap;
    font:12px/1.45 Consolas, monospace;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    padding:16px 20px;
    height:calc(100vh - 180px);
    overflow-y:auto;
    color:#c8ced8;
  }
  
  .ok { color:#7fd0a0; }
  .bad { color:#d08a7f; }
  .warn { color:#d8c07f; }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>MUSTAFA PS4 PS5</b></div>
<div id="wrap">
  <div id="state">Loading poops chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
