<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustafa PS4 - Lapse</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700&display=swap');
  
  * { margin:0; padding:0; box-sizing:border-box; }
  
  html {
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1326 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: white;
    text-align: center;
    font-family: 'Tajawal', sans-serif;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 40px 50px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 100, 255, 0.05);
    transition: all 0.3s ease;
  }
  
  .container:hover {
    border-color: rgba(100, 150, 255, 0.3);
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 100, 255, 0.1);
  }
  
  header {
    margin-bottom: 20px;
  }
  
  .main-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    text-shadow: 0 0 30px rgba(0, 100, 255, 0.2);
    letter-spacing: 2px;
    margin-bottom: 5px;
  }
  
  .highlight {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(255, 46, 99, 0.3);
  }
  
  .ps4-text {
    background: linear-gradient(135deg, #0066ff, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle {
    font-size: 14px;
    font-weight: 700;
    color: #8899bb;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-top: -5px;
  }
  
  .version-badge {
    display: inline-block;
    background: linear-gradient(135deg, #0066ff, #00ccff);
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 15px;
    border-radius: 20px;
    margin-top: 10px;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
  }
  
  .separator {
    border: none;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    margin: 20px 0;
  }
  
  #wrap { padding: 0; }
  
  #state {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 10px;
    color: #8899bb;
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  
  #out {
    white-space: pre-wrap;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    line-height: 1.6;
    background: rgba(17, 21, 27, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 15px;
    height: calc(100vh - 320px);
    min-height: 200px;
    overflow-y: auto;
    color: #8899bb;
    text-align: left;
    direction: ltr;
  }
  
  #out::-webkit-scrollbar {
    width: 5px;
  }
  
  #out::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
  }
  
  #out::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }
  
  .ok { color:#7fd0a0; }
  .bad { color:#d08a7f; }
  .warn { color:#d8c07f; }
  
  footer {
    margin-top: 20px;
  }
  
  .credit {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: #556688;
    letter-spacing: 2px;
  }
  
  .credit-link {
    background: linear-gradient(135deg, #ff6b35, #ff2e63);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  
  .credit-link:hover {
    text-shadow: 0 0 30px rgba(255, 46, 99, 0.4);
  }
  
  .thanks {
    font-size: 12px;
    color: #445566;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  
  @media (max-width: 600px) {
    .container { padding: 25px 20px; border-radius: 20px; }
    .main-title { font-size: 28px; }
    .subtitle { font-size: 11px; letter-spacing: 5px; }
    #state { font-size: 15px; }
    #out { font-size: 10px; height: calc(100vh - 280px); min-height: 150px; }
  }
  
  @media (max-width: 400px) {
    .main-title { font-size: 22px; }
    .version-badge { font-size: 10px; padding: 2px 12px; }
    #state { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 class="main-title">
      <span class="highlight">Mustafa</span>
      <span class="ps4-text">PS4</span>
    </h1>
    <div class="subtitle">Lapse Exploit Chain</div>
    <div class="version-badge">FW 10.00 - 12.02</div>
  </header>
  
  <hr class="separator">
  
  <div id="wrap">
    <div id="state">loading lapse chain...</div>
    <div id="out"></div>
  </div>
  
  <hr class="separator">
  
  <footer>
    <p class="credit">Designed by <a href="#" class="credit-link">Mustafa</a></p>
    <p class="thanks">❤️ Special thanks to all scene developers</p>
  </footer>
</div>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
