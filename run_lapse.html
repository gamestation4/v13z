<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustafa PS4 PS5 - Lapse</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 50%, #0d1326 100%);
    min-height: 100vh;
    color: #fff;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  #brand {
    background: rgba(10, 14, 26, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 24px;
    text-align: left;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  #brand img {
    width: 32px;
    height: 32px;
    margin-right: 10px;
    border-radius: 50%;
    vertical-align: middle;
  }

  #brand b {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .14em;
    color: #e6ebf2;
    vertical-align: middle;
  }

  #brand .chain {
    float: right;
    color: #ff6b35;
    font-size: 12px;
    margin-top: 8px;
    font-weight: 700;
  }

  #wrap {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 24px;
  }

  #state {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 16px 24px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  #state.ok { color: #7fd0a0; }
  #state.bad { color: #d08a7f; }
  #state.warn { color: #d8c07f; }

  #out {
    white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 16px 20px;
    height: calc(100vh - 180px);
    overflow-y: auto;
    color: #c8ced8;
  }

  #out::-webkit-scrollbar {
    width: 8px;
  }

  #out::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.3);
  }

  #out::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
  }

  .ok { color: #7fd0a0; }
  .bad { color: #d08a7f; }
  .warn { color: #d8c07f; }
</style>
</head>
<body>
<div id="brand">
  <img src="logo_raw.png" alt="" width="28" height="28">
  <b>MUSTAFA PS4 PS5</b>
  <span class="chain">LAPSE</span>
</div>
<div id="wrap">
  <div id="state">Loading lapse chain...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
